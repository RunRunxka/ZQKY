# 教材 RAG 的向量库：本机单用户部署，数据落在 Docker named volume。
# Windows 的 H:\... 目录不直接挂载进容器，避免文件锁与权限差异。
#
# 正式：docker compose -f infra/qdrant/docker-compose.yml up -d
# 测试：docker compose -f infra/qdrant/docker-compose.test.yml up -d
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: zqky-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - zqky-qdrant-data:/qdrant/storage

volumes:
  zqky-qdrant-data:
    name: zqky-qdrant-data
