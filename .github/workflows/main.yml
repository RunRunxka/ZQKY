name: Build ZQKY Web (standalone)

# 手动触发：仓库页面 → Actions → 左侧选这个 workflow → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 只在 CI 构建时开启 standalone 输出，不改仓库里的源码
      - name: Enable standalone output
        working-directory: apps/web
        run: |
          sed -i "s/const config: NextConfig = {/const config: NextConfig = {\n  output: 'standalone',/" next.config.ts
          grep -n "output: 'standalone'" next.config.ts

      - name: Build web
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx next build

      - name: Assemble standalone bundle
        working-directory: apps/web
        run: |
          set -euo pipefail
          SERVER_JS="$(find .next/standalone -name server.js -type f | head -n 1)"
          test -n "$SERVER_JS"
          APP_DIR="$(dirname "$SERVER_JS")"
          echo "server.js: $SERVER_JS"

          mkdir -p "$APP_DIR/.next"
          cp -r .next/static "$APP_DIR/.next/static"
          if [ -d public ]; then cp -r public "$APP_DIR/public"; fi

          tar -czf "$GITHUB_WORKSPACE/zqky-web-standalone.tar.gz" -C .next/standalone .
          cd "$GITHUB_WORKSPACE"
          sha256sum zqky-web-standalone.tar.gz > zqky-web-standalone.tar.gz.sha256
          ls -lh zqky-web-standalone.tar.gz
          cat zqky-web-standalone.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zqky-web-standalone
          path: |
            zqky-web-standalone.tar.gz
            zqky-web-standalone.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
